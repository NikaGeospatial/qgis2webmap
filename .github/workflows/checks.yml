name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  compile:
    # Byte-compiles every module. PyQGIS is unavailable on the runner, so this
    # catches syntax errors, not import errors — cheap and worth having before
    # a QGIS-in-Docker tier arrives with the project reader.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q nika_onlymap_exporter scripts

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build plugin zip
        run: python scripts/package_plugin.py
      - name: Verify zip shape against QGIS repository requirements
        # Globbed on the extension, not the product name, so a rename in the
        # packager cannot silently stop matching. `dist/` is built fresh in this
        # job, so there is only ever one zip in it.
        run: |
          zip=$(ls dist/*.zip)
          python scripts/verify_package.py "$zip"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error

  security:
    # Static security scan. The QGIS plugin repository runs its own scanner at
    # submission; failing here first is cheaper than failing there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -r nika_onlymap_exporter -ll

  guards:
    # Enforces CONTRIBUTING.md rules 1 and 2. Implemented as pytest rather than
    # grep because a text search cannot tell a forbidden call from a docstring
    # explaining why it is forbidden — see tests/unit/test_metadata.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/checks.yml
      - run: pip install pytest
      # Build first: some tests inspect the packaged zip (that the help guides
      # ship, for instance) and would otherwise skip silently in CI.
      - run: python scripts/package_plugin.py
      # JUnit durations are setup + call + teardown, so slow fixtures show up
      # as well as slow tests; `--durations` prints the slowest in the log.
      - run: python -m pytest tests/unit -q --durations=25
             --junitxml=reports/unit.xml -o junit_duration_report=total
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: reports/
          if-no-files-found: ignore

  qgis:
    # The PyQGIS tiers, in QGIS's own container so no PyQGIS install is needed.
    # `tests/fixtures` runs every fixture project through issue #29's release
    # gates. Those gates need the real runtime to export anything, so the fetch
    # step below is what makes them assert rather than skip.
    runs-on: ubuntu-latest
    container: qgis/qgis:ltr
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}
      # Relative to the workspace, which is the same path inside the container
      # and to actions/cache (an absolute host path would not be).
      ONLYMAP_RUNTIME_CACHE: .ci-cache/onlymap-runtime
    steps:
      - uses: actions/checkout@v4
      - name: QGIS and PyQGIS versions
        run: python3 -c "import qgis.core; print(qgis.core.Qgis.version())"
      # Keyed on the pin, so a runtime bump downloads afresh. The browser job
      # below still fetches uncached on purpose: it exercises the plugin's own
      # download-and-verify path.
      - uses: actions/cache@v4
        with:
          path: .ci-cache/onlymap-runtime
          key: onlymap-runtime-${{ hashFiles('nika_onlymap_exporter/runtime/runtime-lock.json') }}
      - name: Fetch the pinned OnlyMap runtime
        run: |
          echo "ONLYMAP_RUNTIME_DIR=$(python3 scripts/fetch_runtime.py)" >> $GITHUB_ENV
      # `-rs` keeps any remaining skip visible. A skip here is a gate that did
      # not run, which must not read as a pass.
      - run: python3 -m pytest tests/qgis tests/fixtures -q -rs --durations=25
             --junitxml=reports/qgis.xml -o junit_duration_report=total
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-qgis
          path: reports/
          if-no-files-found: ignore

  browser:
    # The release gates that are only true if a browser says so: the map mounts,
    # it makes no network request, and the credit component is reachable by
    # keyboard without covering the map controls.
    #
    # Needs the OnlyMap runtime to mount a real map. It is not vendored (see
    # docs/architecture.md), so the job fetches the pinned build from the
    # registry first - through the plugin's own download-and-verify path, not a
    # curl, so the code that reaches the network on a user's machine is exercised
    # here too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/checks.yml
      - run: pip install pytest pytest-playwright
      # Browser builds are tied to the Playwright release that downloads them,
      # so its version is the cache key. System libraries are not cached:
      # `install-deps` still runs on a hit.
      - id: playwright
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: playwright install-deps chromium firefox webkit
      - name: Fetch the pinned OnlyMap runtime
        run: |
          echo "ONLYMAP_RUNTIME_DIR=$(python scripts/fetch_runtime.py)" >> $GITHUB_ENV
      # `-rs` keeps skips visible. Firefox skips the WebGL2 tests where the
      # runner has no WebGL2; that is an environment limit, not a pass.
      - run: python -m pytest tests/browser -q -rs
             --browser chromium --browser firefox --browser webkit
             --durations=25 --junitxml=reports/browser.xml
             -o junit_duration_report=total
        env:
          PYTHONPATH: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-browser
          path: reports/
          if-no-files-found: ignore
