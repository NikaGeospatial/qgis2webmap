name: pages

on:
  push:
    branches: [main]
    # `configure_site.py` is listed because it runs during this build: a change
    # to how the analytics key is written must redeploy, or the site keeps
    # serving pages built by the previous version of it.
    paths:
      ["docs/**", ".github/workflows/pages.yml", "scripts/configure_site.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Writes `docs/_data/posthog.yml` from the repository secret. The key is
      # deliberately not in the repository - see `scripts/configure_site.py`.
      # With the secret unset this is a no-op and the site simply measures
      # nothing, so a fork's deploy does not fail and does not report to us.
      - name: Configure site analytics
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: python3 scripts/configure_site.py
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Push notification to the IndexNow search indexes, telling them the site
      # changed instead of waiting to be crawled. Google does not participate;
      # Bing does, and Bing's index is what feeds ChatGPT Search and Copilot.
      #
      # After the deploy, not before: it reads the *live* sitemap, so running it
      # first would submit the previous build's URL list. `continue-on-error`
      # because the deploy has already succeeded by this point and a search
      # engine declining a submission is not a reason to redden the run - the
      # script exits 0 on its own failures too, this is belt and braces.
      # This job has no checkout of its own - `deploy-pages` needs none - so the
      # script it runs has to be fetched first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify IndexNow
        continue-on-error: true
        run: python3 scripts/ping_indexnow.py
