name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    # Cheap refusals first, before the checks spend their time.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check below needs main's history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Tag commit must be on main
        # A tag on an unreviewed branch would publish code that never went
        # through main's checks.
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main"
            exit 1
          fi

      - name: Tag must match metadata.txt version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta=$(python -c "import configparser;p=configparser.ConfigParser();p.read('nika_onlymap_exporter/metadata.txt');print(p['general']['version'].strip())")
          if [ "$tag" != "$meta" ]; then
            echo "::error::tag v$tag does not match metadata.txt version $meta"
            exit 1
          fi

      - name: Tag must carry the language packs packs.json pins
        # The plugin zip holds no .qm; the language packs asset is built from
        # this tag's packs, and the plugin accepts it only if they match.
        run: python scripts/verify_tag_packs.py "$GITHUB_SHA"

  checks:
    # The same jobs that gate main, on the tagged commit. A red one stops the
    # release.
    needs: guard
    uses: ./.github/workflows/checks.yml

  release:
    needs: [guard, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Builds the plugin zip and the language packs asset,
      # qgis2webmap-language-packs-<version>.zip, which every copy of this
      # version downloads its languages from. Both are attached below.
      - run: python scripts/package_plugin.py --no-update-check
      - name: Verify zip
        run: |
          python scripts/verify_package.py dist/qgis2webmap-[0-9]*.zip
          ls "dist/qgis2webmap-language-packs-${GITHUB_REF_NAME#v}.zip"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.zip
          generate_release_notes: true
