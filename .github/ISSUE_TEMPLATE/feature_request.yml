name: Feature request
description: Suggest a capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the proposed solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you would like the plugin to do
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Symbology / fidelity
        - Export output or packaging
        - Dialog / usability
        - Processing / automation
        - Documentation
        - Other
    validations: { required: true }
