<!--
  Light/dark theming for the guides.

  This lives in `head-custom.html`, the extension point `jekyll-theme-minimal`
  provides, rather than in a layout override or in the pages themselves. Both
  alternatives were wrong: overriding the layout means re-implementing the
  theme's markup and inheriting its future changes by hand, and Liquid in the
  Markdown would break the plugin's Help tab, which renders these same files
  with Qt and understands no Jekyll syntax. See `docs/_config.yml`.
-->
<style>
  :root {
    color-scheme: light;
    --om-bg: #ffffff;
    --om-fg: #333333;
    --om-muted: #7a7a7a;
    --om-link: #267cb9;
    --om-border: #dddddd;
    --om-surface: #f8f8f8;
    --om-code: #f0f0f0;
  }

  /* The OS preference is the default; the button below overrides it. Both are
     expressed through the same custom properties, so there is one set of rules
     rather than a light copy and a dark copy that drift. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --om-bg: #14171a;
      --om-fg: #d8dee4;
      --om-muted: #9aa4ae;
      --om-link: #6cb6ff;
      --om-border: #2d333b;
      --om-surface: #1c2126;
      --om-code: #22272e;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --om-bg: #14171a;
    --om-fg: #d8dee4;
    --om-muted: #9aa4ae;
    --om-link: #6cb6ff;
    --om-border: #2d333b;
    --om-surface: #1c2126;
    --om-code: #22272e;
  }

  body {
    background-color: var(--om-bg);
    color: var(--om-fg);
  }

  /* The theme colours these individually rather than inheriting, so each has to
     be named. Kept to one rule per group to stay legible. */
  h1, h2, h3, h4, h5, h6, strong, header h1 a {
    color: var(--om-fg);
  }

  a, a:hover, a:visited, header h1 a:hover {
    color: var(--om-link);
  }

  p, li, td, th, header p, dt, dd {
    color: var(--om-fg);
  }

  small, .view small, header p.view {
    color: var(--om-muted);
  }

  pre, code, tt {
    background-color: var(--om-code);
    color: var(--om-fg);
    border-color: var(--om-border);
  }

  blockquote {
    border-left-color: var(--om-border);
    color: var(--om-muted);
  }

  table, table td, table th {
    border-color: var(--om-border);
  }

  table th {
    background-color: var(--om-surface);
  }

  hr {
    background: var(--om-border);
    border-color: var(--om-border);
  }

  #om-theme-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 50;
    padding: 0.35rem 0.7rem;
    font: inherit;
    font-size: 13px;
    line-height: 1.4;
    color: var(--om-fg);
    background: var(--om-surface);
    border: 1px solid var(--om-border);
    border-radius: 6px;
    cursor: pointer;
  }

  #om-theme-toggle:focus-visible {
    outline: 2px solid var(--om-link);
    outline-offset: 2px;
  }

  @media print {
    #om-theme-toggle {
      display: none;
    }
  }
</style>

<script>
  // Applied before first paint, so a dark-mode reader never sees a white flash.
  (function () {
    var KEY = "qgis2webmap-theme";
    var stored = null;
    try {
      stored = localStorage.getItem(KEY);
    } catch (e) {
      /* private browsing: fall through to the OS preference */
    }
    if (stored === "dark" || stored === "light") {
      document.documentElement.setAttribute("data-theme", stored);
    }

    function current() {
      var explicit = document.documentElement.getAttribute("data-theme");
      if (explicit) return explicit;
      return window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    document.addEventListener("DOMContentLoaded", function () {
      var button = document.createElement("button");
      button.id = "om-theme-toggle";
      button.type = "button";

      function label() {
        var now = current();
        // Says what pressing it does, not what the state is - the label is the
        // action, which is how every other control on this site reads.
        button.textContent = now === "dark" ? "Light mode" : "Dark mode";
        button.setAttribute(
          "aria-label",
          now === "dark" ? "Switch to light mode" : "Switch to dark mode"
        );
      }

      button.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try {
          localStorage.setItem(KEY, next);
        } catch (e) {
          /* not persisting is survivable; the toggle still works this visit */
        }
        label();
      });

      label();
      document.body.appendChild(button);
    });
  })();
</script>
