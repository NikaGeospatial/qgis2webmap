<aside class="sidebar">
  <!--
    There is no "Ask on Discord" card here any more. It used to sit above the
    guide list, on the argument that someone who is stuck stops reading and
    would never scroll to a link at the foot of a long guide - but the masthead
    is `position: sticky` and this column is deliberately not, so the sticky
    Discord button was already doing that job better on every screen, while the
    card scrolled out of view. It was the same link twice on thirteen pages, and
    the mobile rules had already started apologising for it.

    The masthead is also the only one of the two that reaches the home page and
    the demos, which have no sidebar at all - so removing it here costs no
    coverage.
  -->
  {% for group in site.data.nav.guides %}
    <p class="sidebar__heading">{{ group.title }}</p>
    <ul>
      {% for item in group.items %}
        <li>
          <a
            href="{{ item.url | relative_url }}"
            {% if page.url == item.url %}aria-current="page"{% endif %}
          >{{ item.title }}</a>
        </li>
      {% endfor %}
    </ul>
  {% endfor %}
</aside>
