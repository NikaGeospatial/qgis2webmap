# Navigation for the layouts.
#
# URLs are written as `.html` and not `.md` on purpose. GitHub Pages runs
# `jekyll-relative-links`, which rewrites `.md` links found in Markdown content
# to their published URLs - but it does not touch layouts, so a `.md` link here
# would ship as a 404. Inside the guides themselves, keep writing `.md`: that is
# what makes one link work on the site, in the repository and in the plugin's
# Help tab at the same time.

