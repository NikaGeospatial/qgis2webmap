# Tooling config only. The plugin itself is not pip-installable — QGIS loads
# `nika_onlymap_exporter/` directly from its plugin directory.
[project]
name = "nika-onlymap-exporter"
version = "0.3.0"
description = "Export QGIS projects to portable OnlyMap web maps"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = ["nika_onlymap_exporter/resources_rc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These modules `pytest.importorskip("qgis.PyQt")` before importing the plugin,
# so a plain Python without QGIS skips them instead of failing collection.
"tests/unit/test_cartograph_dialog_pure.py" = ["E402"]
"tests/unit/test_folder_export_transaction.py" = ["E402"]
"tests/unit/test_packaging.py" = ["E402"]
"tests/unit/test_preview_cleanup.py" = ["E402"]
"tests/unit/test_preview_hook.py" = ["E402"]
"tests/unit/test_raster_staging.py" = ["E402"]
"tests/unit/test_terrain_zoom_clamp.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
# PyQGIS ships no stubs; do not fail on its untyped surface.
ignore_missing_imports = true
